spring.application.name=rest-test-healing-sut

# Banco: H2 em memória. O schema vem de src/main/resources/schema.sql, executado antes do Hibernate
# (comportamento padrão para banco embarcado; por isso spring.jpa.defer-datasource-initialization
# fica no padrão, false). O Hibernate só confere se as entidades batem com esse schema.
spring.jpa.hibernate.ddl-auto=validate

# O acesso ao banco termina no service; os controllers recebem DTOs prontos.
spring.jpa.open-in-view=false

# Desserialização estrita: campo desconhecido no JSON da requisição gera 400 (JSON_INVALIDO).
# Sem isso, um teste que ainda envia um campo renomeado ou removido continuaria passando.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Contrato em /v3/api-docs com as chaves em ordem alfabética e indentado, para que o retrato salvo em
# docs/openapi.json saia igual a cada geração e tenha diffs legíveis.
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
