# Ordem de execução dos testes: mitigação contra testes instáveis (ver "Execuções contra testes
# instáveis" no README).
# Classes e métodos em ordem aleatória com semente fixa: a ordem é embaralhada, mas a mesma a cada
# execução, o que mantém as execuções reproduzíveis. Para rodar em outra ordem, troque a semente pela
# opção de VM -Djunit.jupiter.execution.order.random.seed=<n>, que tem precedência sobre este arquivo.
junit.jupiter.testmethod.order.default=org.junit.jupiter.api.MethodOrderer$Random
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$Random
junit.jupiter.execution.order.random.seed=1
